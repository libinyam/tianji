<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="天玑 -- 面向跨专业 AI 转型者的学习与项目共创社区。整合学习资源、工具教程、项目案例与协作空间，帮你从只会学理论，走向能做项目、会协作、能产出。" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://tianjihub.cn/" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- #342 HTTP 强制跳转 HTTPS（前端兜底，CloudBase Hosting 控制台需同时开启"强制 HTTPS"） -->
    <script>
      (function () {
        if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
          location.replace('https:' + location.href.substring(location.protocol.length));
        }
      })();
    </script>
    <!-- #421 首帧前应用主题：React 挂载后才加 .dark 类会导致深色用户每次进站先白闪一下。
         须与 src/stores/theme.ts 的 STORAGE_KEY 及回退逻辑保持一致 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tianji-theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* localStorage 不可用时静默走默认浅色 */ }
      })();
    </script>
    <!-- Open Graph -->
    <meta property="og:title" content="天玑 · 跨专业 AI 学习与项目共创社区" />
    <meta property="og:description" content="整合学习资源、工具教程、项目案例与协作空间，帮你从只会学理论，走向能做项目、会协作、能产出。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tianjihub.cn/" />
    <meta property="og:site_name" content="天玑 Tianji" />
    <meta property="og:locale" content="zh_CN" />
    <!-- Twitter Card：#423 站点尚无 og:image 分享图，声明 summary_large_image 会被部分平台降级
         显示；先诚实声明 summary，制作 1200x630 品牌图放入 public/ 后再升级回 large -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="天玑 · 跨专业 AI 学习与项目共创社区" />
    <meta name="twitter:description" content="整合学习资源、工具教程、项目案例与协作空间，帮你从只会学理论，走向能做项目、会协作、能产出。" />
    <title>天玑 · 跨专业 AI 学习与项目共创社区</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 部署更新后旧 chunk hash 失效，自动刷新获取最新资源
      // 用时间戳防止无限刷新：10 秒内只刷新一次
      (function () {
        var KEY = 'tianji:reloaded';
        var now = Date.now();
        var last = parseInt(sessionStorage.getItem(KEY) || '0', 10);
        window.addEventListener('error', function (e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')
              && (target.src || target.href)
              && (target.src || target.href).includes('/assets/')) {
            if (now - last > 10000) {
              sessionStorage.setItem(KEY, String(now));
              window.location.reload();
            }
          }
        }, true);
        // 页面成功加载后清除标记
        window.addEventListener('load', function () {
          setTimeout(function () { sessionStorage.removeItem(KEY); }, 5000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
